# Publish the site: the root hub, games/, experiments/, design/ and eyecandy/, each without its headless harness.
name: Deploy the browser lab to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir _site
          # the published layout mirrors the repo, so every relative link works the same in git and on Pages
          cp index.html _site/index.html
          rsync -a --exclude tools/ games/ _site/games/
          rsync -a --exclude tools/ experiments/ _site/experiments/
          rsync -a --exclude tools/ design/ _site/design/
          rsync -a --exclude tools/ eyecandy/ _site/eyecandy/
          # One file under tools/ is part of the site: the gallery page fetches the harness
          # manifest at runtime, so its shot counts are the harness's own numbers and not a
          # transcription. With tools/ excluded, that fetch 404'd on Pages and the page silently
          # fell back to transcribed counts, which is the thing the comment promised not to do.
          # Everything else under tools/ — scripts, reports, the shooting output — stays out.
          mkdir -p _site/design/tools
          cp design/tools/manifest.json _site/design/tools/manifest.json
          # keep the pre-lab game URLs (/1-breakout/, ...) pointing at their new home
          for g in 1-breakout 2-runner 3-marble-maze 4-tower-defense 5-flight; do
            mkdir -p "_site/$g"
            printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=../games/%s/"><a href="../games/%s/">%s</a>' "$g" "$g" "$g" > "_site/$g/index.html"
          done
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

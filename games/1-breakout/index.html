<!DOCTYPE html>
<html lang="en">
<head>

  <title>3D Breakout</title>
  <link rel="stylesheet" href="../shared/hud.css" />

<body>
  <div id="hud" class="hud">

    <span class="hud-key">&#9664;</span><span class="hud-key">&#9654;</span> move

    <span class="hud-key">M</span> sound

  <div id="stage"></div>

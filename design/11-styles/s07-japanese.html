<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ternmark — Japanese minimal</title>
<meta name="description" content="The Ternmark home page in a Japanese editorial idiom: a vertical title, hairlines, one vermilion seal, and a lot of space.">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2024%2024'%3E%3Crect%20width='24'%20height='24'%20fill='%23f4f2ed'/%3E%3Crect%20x='6'%20y='6'%20width='12'%20height='12'%20rx='2'%20fill='%23c8402f'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/zen-old-mincho@5.3.0/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/zen-old-mincho@5.3.0/500.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/zen-old-mincho@5.3.0/700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/zen-kaku-gothic-new@5.3.0/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/zen-kaku-gothic-new@5.3.0/500.css">
<link rel="stylesheet" href="s07-japanese.css">
</head>
<body data-style="s07-japanese">
<a class="skip" href="#main">Skip to content</a>
<div id="app"></div>
<script type="module">
import { renderPage, esc } from "./render.js";

const tpl = (c) => `
<header class="bar">
  <div class="brand">
    <span class="seal" aria-hidden="true">${esc(c.brand[0])}</span>
    <span class="bt"><b>${esc(c.brand)}</b><i>${esc(c.brandNote)}</i></span>
  </div>
  <nav class="nav" aria-label="Sections">
    <a href="#feat">Features</a><a href="#stats">Measures</a><a href="#plans">Price</a><a href="#foot">Letters</a>
  </nav>
</header>
<main id="main">
  <section class="hero">
    <div class="vert" aria-hidden="true">${esc(c.kicker)} · ${esc(c.brandNote)}</div>
    <div class="hero-copy">
      <p class="kicker">${esc(c.kicker)}</p>
      <h1>${esc(c.h1)}</h1>
      <p class="rule-thin" aria-hidden="true"></p>
      <p class="lede">${esc(c.lede)}</p>
      <p class="cta">
        <a class="cta-a" href="#plans">${esc(c.ctaPrimary)}</a>
        <a class="cta-b" href="#stats">${esc(c.ctaSecondary)}</a>
      </p>
    </div>
    <div class="hero-fig">
      <svg viewBox="0 0 260 210" role="img" aria-label="A thin ink drawing: reeds, a wader, and a low tide line.">
        <path d="M12 176 C 70 168, 150 172, 248 160" fill="none" stroke="#1b1b1b" stroke-width="1"/>
        <path d="M12 186 C 80 180, 160 184, 248 174" fill="none" stroke="#9a958a" stroke-width="1"/>
        <g stroke="#1b1b1b" fill="none" stroke-width="1.2" stroke-linecap="round">
          <path d="M52 176 C 46 150, 54 132, 44 116"/>
          <path d="M64 176 C 66 152, 58 138, 68 120"/>
          <path d="M78 176 C 74 158, 82 146, 76 130"/>
        </g>
        <g stroke="#1b1b1b" fill="none" stroke-width="1.3" stroke-linejoin="round">
          <path d="M168 176 l0 -22 M178 176 l0 -22"/>
          <path d="M158 154 c 0 -12, 10 -18, 20 -16 c 8 2, 12 8, 10 16 c -2 8 -12 10 -22 8 z"/>
          <path d="M188 140 l14 -4 -12 8"/>
        </g>
        <circle cx="222" cy="46" r="17" fill="none" stroke="#c8402f" stroke-width="1.4"/>
        <path d="M212 46 h20" stroke="#c8402f" stroke-width="1.4"/>
      </svg>
      <p class="cap">Pl. 1 — the Sandbar at half tide</p>
    </div>
  </section>

  <section class="sec" id="feat" aria-labelledby="feat-h">
    <h2 class="sec-h" id="feat-h"><span class="en">Features</span><span class="num">三</span></h2>
    <ol class="feat">
      ${c.features.map((f, i) => `<li>
        <span class="idx" aria-hidden="true">${["01", "02", "03"][i]}</span>
        <div class="body">
          <h3>${esc(f.t)}</h3>
          <p>${esc(f.b)}</p>
        </div>
      </li>`).join("")}
    </ol>
  </section>

  <section class="sec" id="stats" aria-labelledby="stats-h">
    <h2 class="sec-h" id="stats-h"><span class="en">Measures</span><span class="num">二</span></h2>
    <div class="stats">
      ${c.stats.map((s) => `<div class="stat">
        <b>${esc(s.v)}</b>
        <span class="u">${esc(s.u)}</span>
        <em>${esc(s.n)}</em>
      </div>`).join("")}
    </div>
  </section>

  <section class="sec" id="quote" aria-labelledby="quote-h">
    <h2 class="sec-h" id="quote-h"><span class="en">A letter</span><span class="num">一</span></h2>
    <blockquote>
      <p>${esc(c.quote.q)}</p>
      <footer><b>${esc(c.quote.by)}</b><i>${esc(c.quote.role)}</i></footer>
    </blockquote>
  </section>

  <section class="sec" id="plans" aria-labelledby="plans-h">
    <h2 class="sec-h" id="plans-h"><span class="en">Price</span><span class="num">四</span></h2>
    <div class="plans">
      ${c.plans.map((p) => `<article class="${p.best ? "best" : ""}">
        ${p.best ? `<p class="flag">Chosen by the recorders</p>` : ""}
        <h3>${esc(p.t)}</h3>
        <p class="price">${esc(p.p)}<em>${esc(p.per)}</em></p>
        <ul>${p.l.map((l) => `<li>${esc(l)}</li>`).join("")}</ul>
        <a class="cta-a" href="#foot">${esc(c.ctaPrimary)}</a>
      </article>`).join("")}
    </div>
  </section>
</main>
<footer id="foot">
  <div class="foot">
    <div class="foot-a">
      <p class="made">${esc(c.foot.made)}</p>
      <form data-subscribe>
        <label for="em">${esc(c.foot.inputLabel)}</label>
        <p class="hint">${esc(c.foot.inputHint)}</p>
        <p class="field"><input id="em" type="email" name="email" placeholder="you@example.org"><button type="submit">${esc(c.foot.inputButton)}</button></p>
        <p class="status" role="status" data-status></p>
      </form>
    </div>
    <nav class="foot-b" aria-label="Footer">${c.foot.lines.map((l) => `<a href="#main">${esc(l)}</a>`).join("")}</nav>
    <div class="foot-c">
      <span class="seal" aria-hidden="true">${esc(c.brand[0])}</span>
      <p class="legal">${esc(c.foot.legal)}<br>${esc(c.brand)} · ${esc(c.kicker)}</p>
    </div>
  </div>
</footer>
`;

await renderPage(tpl, { title: (c) => `${c.brand} — Japanese minimal (vertical title)` });
</script>
</body>
</html>

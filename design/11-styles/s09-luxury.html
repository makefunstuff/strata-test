<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ternmark — Luxury</title>
<meta name="description" content="The Ternmark home page as a house of distinction: a hairline frame, centred symmetry, light serif at large sizes, one gold.">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2024%2024'%3E%3Crect%20width='24'%20height='24'%20fill='%23f7f5f1'/%3E%3Ccircle%20cx='12'%20cy='12'%20r='8'%20fill='none'%20stroke='%23a9834f'/%3E%3Ctext%20x='8.4'%20y='16'%20font-family='Georgia,serif'%20font-size='11'%20fill='%2316181d'%3ET%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/cormorant-garamond@5.3.0/300.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/cormorant-garamond@5.3.0/300-italic.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/cormorant-garamond@5.3.0/500.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/jost@5.3.0/300.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/jost@5.3.0/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/jost@5.3.0/500.css">
<link rel="stylesheet" href="s09-luxury.css">
</head>
<body data-style="s09-luxury">
<div class="frame" aria-hidden="true"></div>
<a class="skip" href="#main">Skip to content</a>
<div id="app"></div>
<script type="module">
import { renderPage, esc } from "./render.js";

const ornament = () => `<span class="orn" aria-hidden="true"><i></i><b>◈</b><i></i></span>`;

const tpl = (c) => `
<header class="mast">
  <p class="mono" aria-hidden="true">${esc(c.brand[0])}</p>
  <h1 class="wordmark">${esc(c.brand)}</h1>
  <p class="sub">${esc(c.brandNote)}</p>
  ${ornament()}
  <nav class="nav" aria-label="Sections">
    <a href="#feat">The services</a><a href="#stats">The measures</a><a href="#plans">The terms</a><a href="#foot">Correspondence</a>
  </nav>
</header>
<main id="main">
  <section class="hero">
    <p class="kicker">${esc(c.kicker)}</p>
    <h2 class="hed">Every bird you saw, <em>in the place you saw it,</em> with no signal.</h2>
    <p class="lede">${esc(c.lede)}</p>
    <p class="cta">
      <a class="cta-a" href="#plans">${esc(c.ctaPrimary)}</a>
      <a class="cta-b" href="#stats">${esc(c.ctaSecondary)}</a>
    </p>
    <div class="plate">
      <svg viewBox="0 0 320 190" role="img" aria-label="A gold line drawing of reeds, a wader and a low tide.">
        <path d="M20 150 C 90 142, 190 148, 300 136" fill="none" stroke="#a9834f" stroke-width="1"/>
        <path d="M20 160 C 110 152, 210 158, 300 148" fill="none" stroke="#a9834f" stroke-width="1" opacity=".6"/>
        <g stroke="#16181d" fill="none" stroke-width="1" stroke-linecap="round">
          <path d="M74 150 C 66 122, 76 106, 64 88"/>
          <path d="M88 150 C 90 124, 80 110, 92 92"/>
          <path d="M102 150 C 96 132, 106 118, 100 102"/>
        </g>
        <g stroke="#16181d" fill="none" stroke-width="1.1" stroke-linejoin="round">
          <path d="M212 150 l0 -20 M222 150 l0 -20"/>
          <path d="M202 130 c 0 -11, 10 -16, 19 -14 c 8 2, 11 7, 9 14 c -2 7 -11 9 -20 7 z"/>
          <path d="M230 118 l13 -4 -11 8"/>
        </g>
      </svg>
      <p class="cap">The estuary at half tide · plate one</p>
    </div>
  </section>

  <section class="sec" id="feat" aria-labelledby="feat-h">
    <h2 class="sec-h" id="feat-h">The services</h2>
    ${ornament()}
    <div class="svc">
      ${c.features.map((f, i) => `<article>
        <p class="n" aria-hidden="true">${["I", "II", "III"][i]}</p>
        <h3>${esc(f.t)}</h3>
        <p>${esc(f.b)}</p>
      </article>`).join("")}
    </div>
  </section>

  <section class="sec" id="stats" aria-labelledby="stats-h">
    <h2 class="sec-h" id="stats-h">The measures</h2>
    ${ornament()}
    <div class="measures">
      ${c.stats.map((s) => `<div class="measure">
        <b>${esc(s.v)}</b>
        <span class="u">${esc(s.u)}</span>
        <em>${esc(s.n)}</em>
      </div>`).join("")}
    </div>
  </section>

  <section class="sec" id="quote" aria-labelledby="quote-h">
    <h2 class="sec-h" id="quote-h">A letter of thanks</h2>
    ${ornament()}
    <blockquote>
      <p>${esc(c.quote.q)}</p>
      <footer><b>${esc(c.quote.by)}</b><i>${esc(c.quote.role)}</i></footer>
    </blockquote>
  </section>

  <section class="sec" id="plans" aria-labelledby="plans-h">
    <h2 class="sec-h" id="plans-h">The terms</h2>
    ${ornament()}
    <div class="terms">
      ${c.plans.map((p) => `<article class="${p.best ? "best" : ""}">
        ${p.best ? `<p class="flag">By request of the recorders</p>` : ""}
        <h3>${esc(p.t)}</h3>
        <p class="price">${esc(p.p)}<em>${esc(p.per)}</em></p>
        <ul>${p.l.map((l) => `<li>${esc(l)}</li>`).join("")}</ul>
        <a class="cta-a" href="#foot">${esc(c.ctaPrimary)}</a>
      </article>`).join("")}
    </div>
  </section>
</main>
<footer id="foot">
  ${ornament()}
  <div class="foot">
    <div class="foot-a">
      <p class="made">${esc(c.foot.made)}</p>
      <form data-subscribe>
        <label for="em">${esc(c.foot.inputLabel)}</label>
        <p class="hint">${esc(c.foot.inputHint)}</p>
        <p class="field"><input id="em" type="email" name="email" placeholder="you@example.org"><button type="submit">${esc(c.foot.inputButton)}</button></p>
        <p class="status" role="status" data-status></p>
      </form>
    </div>
    <nav class="foot-b" aria-label="Footer">${c.foot.lines.map((l) => `<a href="#main">${esc(l)}</a>`).join("")}</nav>
    <p class="legal">${esc(c.foot.legal)}<br>${esc(c.brand)} · ${esc(c.kicker)}</p>
  </div>
  <p class="mono end" aria-hidden="true">${esc(c.brand[0])}</p>
</footer>
`;

await renderPage(tpl, { title: (c) => `${c.brand} — A house of distinction (Luxury)` });
</script>
</body>
</html>
